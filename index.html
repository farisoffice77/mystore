<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Dear</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Fraunces:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1226;--mut:#667085;--line:#e4e4e0;--soft:#f4f4f1;--red:#c8102e}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}button,select,input,textarea{font:inherit}button{cursor:pointer}
.top{background:var(--ink);color:#fff;text-align:center;font-size:12px;letter-spacing:.18em;padding:10px;font-weight:700}
header{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{font-family:'Pacifico',cursive;font-size:26px;color:var(--ink)}
.ic{background:none;border:0;font-size:22px;padding:6px 8px;position:relative;color:var(--ink)}
.cnt{position:absolute;top:-1px;right:-2px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
#menu{position:fixed;inset:0;background:#fff;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-size:24px}
#menu.on{display:flex}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
h2{font-family:'Fraunces',serif;font-size:30px;text-align:center;margin:40px 0 20px;font-weight:600}
h2.up{font-family:'DM Sans',sans-serif;font-size:20px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.hero{margin:0 -16px;padding:54px 22px;background:linear-gradient(120deg,#e9e9e4,#cfd6e4);background-size:cover;background-position:center}
.hero small{letter-spacing:.2em;font-weight:700;font-size:12px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:.92;margin:14px 0;font-weight:400}
.hero p{margin:0 0 22px;color:#3b4256}
.btn{display:inline-block;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:14px 26px;border-radius:6px;font-weight:700;text-align:center}
.btn.o{background:#fff;color:var(--ink);width:100%;margin-top:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 -16px;padding:16px;background:var(--soft);font-size:12px;color:var(--mut)}
.trust b{display:block;color:var(--ink);font-size:12px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats a{border:1px solid var(--ink);border-radius:4px;overflow:hidden;text-align:center;font-weight:500}
.cats img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft);display:block}
.cats span{display:block;padding:8px 2px;text-transform:uppercase;font-size:11px;font-weight:500}
.promo{margin:34px -16px 0;border-block:1px solid var(--ink);padding:16px;text-align:center;letter-spacing:.14em;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card .im{position:relative;aspect-ratio:3/4;background:var(--soft);overflow:hidden}
.card img,.big img{width:100%;height:100%;object-fit:cover;display:block}
.b{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;padding:6px 10px;border-radius:14px}
.n{margin:10px 0 4px;font-size:13px;text-transform:uppercase}
s{color:var(--mut);margin-left:4px}em{color:var(--red);font-style:normal;font-size:12px;margin-left:4px}
.srch{width:100%;padding:14px 20px;border:1px solid var(--line);border-radius:30px}
.row{display:flex;gap:10px;margin:12px 0 18px}.row select{flex:1;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.pg{display:grid;gap:22px;padding-top:16px}
.big{aspect-ratio:3/4;background:var(--soft);border-radius:10px;overflow:hidden}
.th{display:flex;gap:10px;margin-top:10px}.th img{width:68px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.pt{font-size:24px;text-transform:uppercase;margin:8px 0;font-weight:500}
.tag{background:#0c4a34;color:#fff;font-size:13px;padding:6px 12px;border-radius:16px;font-weight:700}
.pr{font-size:26px;margin:10px 0}.ft{list-style:none;padding:0;color:#3b4256;line-height:2}
.sz{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.sz button{padding:14px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700}
.sz button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.sz button:disabled{opacity:.35;text-decoration:line-through}
.qr{display:flex;gap:10px}.q{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.q button{border:0;background:none;font-size:20px;padding:12px 16px}.q span{min-width:26px;text-align:center}.qr .btn{flex:1}
.ci{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ci img{width:84px;height:104px;object-fit:cover;border-radius:6px}.ci div{flex:1;font-size:14px}
.ci .q{display:inline-flex;margin-top:8px}.ci .q button{padding:4px 12px}
.rm{background:none;border:0;color:var(--red);padding:0;margin-left:10px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:16px 0}
.fm input,.fm textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.ship{background:var(--soft);padding:10px 14px;border-radius:8px;font-size:13px;margin:12px 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;display:none;z-index:40}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 16px;border-top:1px solid var(--line)}
.cats.two{grid-template-columns:repeat(2,1fr)}.cats.two span{font-size:14px;padding:12px}
.sw{text-align:center;color:var(--mut);cursor:pointer;font-size:13px}
.oc{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6;word-break:break-word}
.auth{max-width:420px;margin:auto}
.wa{position:fixed;right:16px;bottom:18px;z-index:35;background:#25d366;color:#fff;border-radius:30px;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.paybox{max-width:420px;margin:auto}
.low{color:var(--red);font-size:12px;font-weight:700;margin-top:4px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.dlg input,.dlg textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.cats span{font-size:14px;padding:12px}.trust{grid-template-columns:repeat(4,1fr)}.pg{grid-template-columns:1fr 1fr;gap:44px}.hero{margin:0;border-radius:10px;padding:90px 56px}.hero h1{font-size:96px}.trust,.promo{margin-left:0;margin-right:0}}
</style></head><body>
<div class="top" id="tag"></div>
<header>
<button class="ic" id="mb" aria-label="Menu">☰</button>
<a class="logo" href="#" id="logo"></a>
<div><button class="ic" id="sb" aria-label="Search">⌕</button><button class="ic" id="cb" aria-label="Cart">🛍<span class="cnt" id="cn" hidden>0</span></button></div>
</header>
<nav id="menu"><a href="#">Home</a><a href="#categories">Categories</a><a href="#shop">Collections</a><a href="#contact">Contact</a><a href="#login" id="ml">Login / Sign up</a><a href="#admin">Admin</a></nav>
<main id="app"><p style="text-align:center;padding:60px 0">Loading…</p></main>
<a class="wa" id="wab" href="#">💬 WhatsApp</a>
<footer id="foot"></footer><div id="toast"></div>
<script>
// ===== SETTINGS: change these =====
const BRAND='Hello Dear';
const TAGLINE='BUDGET & PREMIUM FANCY ORNAMENTS';
const API='https://script.google.com/macros/s/AKfycby8aVJEu-qLAWz3Tf7HQXELxqBScIxT81k_Xpyyc_KhULC9W-QBFUKtFSSH4mG4cAGudQ/exec';
const WA='919656703262';
const UPI='farismuhammed006@okaxis';
const BANNER='';   // optional: direct image link for the home banner
// ==================================
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=[],cart=[],F={q:'',cat:'',sort:''},sel='',qty=1;
try{cart=JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}$('#cn').textContent=cart.reduce((a,c)=>a+c.qty,0);$('#cn').hidden=!cart.length};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)};
const get=id=>P.find(p=>p.id===id);
const nm=x=>parseFloat(String(x==null?'':x).replace(/[^\d.]/g,''))||0;
let cur='';
const ps=x=>{const t=String(x==null?'':x);if(t.indexOf(':')<0)return{per:false,l:t.split(/[\s,]+/).filter(Boolean).map(n=>({n,s:null}))};const l=[];t.replace(/\s*([^:,]+?)\s*:\s*(\d+)/g,(m,n,q)=>{l.push({n:n.trim(),s:+q});return m});return{per:true,l}};
const szs=(p,z)=>{if(!p.per||!z)return p.stock;const x=p.sizes.find(y=>y.n===z);return x?x.s:0};
let tok='',me=null,mode='login';
try{tok=localStorage.getItem('tok')||'';me=JSON.parse(localStorage.getItem('me')||'null')}catch(e){}
const acl=()=>{$('#ml').textContent=me?(me.admin?'Admin panel':'My orders'):'Login / Sign up';$('#ml').href=me?(me.admin?'#admin':'#account'):'#login'};
const setAuth=(t,m)=>{tok=t;me=m;try{localStorage.setItem('tok',t);localStorage.setItem('me',JSON.stringify(m))}catch(e){}acl()};
const api=(action,d={})=>fetch(API,{method:'POST',body:JSON.stringify({action,token:tok,...d})}).then(r=>r.json()).catch(()=>({ok:false,error:'Network error. Please try again.'}));
const oc=o=>`<div class="oc"><b>${esc(o.orderId)}</b> · ${esc(o.time)}<br>${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.address)}<br>${esc(o.items)}<br><b>₹${esc(o.total)}</b> · ${esc(o.status)}${o.method?' · '+esc(o.method):''}${o.utr?'<br><small>Txn ID: '+esc(o.utr)+'</small>':''}${o.account?'<br><small>Account: '+esc(o.account)+'</small>':''}</div>`;
function cats(){const c=[...new Set(P.map(p=>p.cat).filter(Boolean))];
app.innerHTML=`<h2>Categories</h2>${c.length?`<div class="cats two">${c.map(x=>`<a href="#shop-${encodeURIComponent(x)}"><img src="${esc(P.find(p=>p.cat===x).imgs[0])}" alt=""><span>${esc(x)}</span></a>`).join('')}</div>`:'<p style="text-align:center">No categories yet.</p>'}`}
function login(){app.innerHTML=`<h2>${mode=='reg'?'Create account':'Customer login'}</h2><div class="fm auth">${mode=='reg'?'<input id="an" placeholder="Full name">':''}<input id="ap" type="tel" placeholder="Phone number"><input id="aw" type="password" placeholder="Password (min 6 characters)"><button class="btn" style="width:100%" onclick="doAuth()">${mode=='reg'?'Create account':'Login'}</button><p class="sw" onclick="mode=mode=='reg'?'login':'reg';login()">${mode=='reg'?'Already have an account? Login':'New here? Create an account'}</p><p class="sw">Accounts are optional. You can order without one.</p></div>`}
async function doAuth(){const d={phone:$('#ap').value,password:$('#aw').value};if(mode=='reg')d.name=$('#an').value;
const r=await api(mode=='reg'?'register':'login',d);if(!r.ok)return alert(r.error||'Failed');setAuth(r.token,{name:r.name,phone:r.phone});location.hash='account'}
async function account(){if(!me)return location.hash='login';if(me.admin)return location.hash='admin';
app.innerHTML=`<h2>Hi, ${esc(me.name)}</h2><p style="text-align:center">Your orders</p><div id="ol">Loading…</div><p style="text-align:center"><button class="btn o" style="width:auto" onclick="logout()">Logout</button></p>`;
const r=await api('myOrders');if(!r.ok)return logout();$('#ol').innerHTML=r.orders.map(oc).join('')||'<p style="text-align:center">No orders yet.</p>'}
async function admin(){
if(me&&me.admin){app.innerHTML=`<h2>All orders</h2><p style="text-align:center"><a class="btn" href="#admin-products">Manage products</a> <button class="btn o" style="width:auto" onclick="logout()">Logout</button></p><div id="ol">Loading…</div>`;
const r=await api('allOrders');if(!r.ok)return logout();$('#ol').innerHTML=`<p style="text-align:center">${r.orders.length} orders</p>`+r.orders.map(oc).join('');return}
app.innerHTML=`<h2>Admin login</h2><div class="fm auth"><input id="aw" type="password" placeholder="Admin password"><button class="btn" style="width:100%" onclick="adm()">Login</button></div>`}
async function adm(){const r=await api('adminLogin',{password:$('#aw').value});if(!r.ok)return alert(r.error||'Wrong password');setAuth(r.token,{name:'Admin',admin:true});admin()}
function logout(){api('logout');setAuth('',null);location.hash='';route()}
document.title=BRAND;$('#tag').textContent=TAGLINE;$('#logo').textContent=BRAND;
$('#foot').innerHTML='© '+esc(BRAND)+' · <a href="https://wa.me/'+WA+'">WhatsApp us</a>';
$('#mb').onclick=()=>{$('#menu').classList.toggle('on');$('#mb').textContent=$('#menu').classList.contains('on')?'✕':'☰'};
$('#wab').href='https://wa.me/'+WA;
$('#cb').onclick=()=>location.hash='cart';
$('#sb').onclick=()=>{location.hash='shop';setTimeout(()=>$('#q')&&$('#q').focus(),50)};

const lwn=n=>{const t=n<=0?'Sold out':n==1?'Only 1 left':n<=3?'Few items left':'';return t?`<div class="low">${t}</div>`:''};
const lw=p=>lwn(p.stock);
const card=p=>`<a class="card" href="#p-${esc(p.id)}"><div class="im">${p.tag?`<span class="b">${esc(p.tag)}</span>`:''}<img loading="lazy" src="${esc(p.imgs[0])}" alt=""></div><div class="n">${esc(p.name)}</div><div><b>₹${p.price}</b>${p.old>p.price?`<s>₹${p.old}</s><em>${Math.round(100-p.price/p.old*100)}% off</em>`:''}</div>${lw(p)}</a>`;

function home(){
const cats=[...new Set(P.map(p=>p.cat).filter(Boolean))];
app.innerHTML=`<section class="hero" ${BANNER?`style="background-image:url('${esc(BANNER)}')"`:''}><small>${esc(BRAND.toUpperCase())}</small><h1>FANCY ORNAMENTS<br>FOR EVERY STYLE</h1><p>Budget and premium ornaments, delivered all over India.</p><a class="btn" href="#shop">Shop now</a></section>
<div class="trust"><div><b>Budget and premium</b>Ornaments for every occasion</div><div><b>Secure ordering</b>Confirmed on WhatsApp</div><div><b>All India delivery</b>We ship across India</div><div><b>Quality checked</b>Inspected before shipping</div></div>
${cats.length?`<h2 class="up">Top Collection</h2><div class="cats">${cats.map(c=>`<a href="#shop-${encodeURIComponent(c)}"><img src="${esc(P.find(p=>p.cat===c).imgs[0])}" alt=""><span>${esc(c)}</span></a>`).join('')}</div>`:''}
<div class="promo">ALL INDIA DELIVERY · SECURE ORDERING</div>
<h2>New Arrivals</h2><div class="grid">${P.slice(-8).reverse().map(card).join('')}</div>`}

function shop(cat){
F.cat=cat||'';F.sort='';const cats=[...new Set(P.map(p=>p.cat).filter(Boolean))];
app.innerHTML=`<h2>Our Full Collection</h2><input id="q" class="srch" placeholder="Search products" value="${esc(F.q)}">
<div class="row">${cats.length?`<select id="cat"><option value="">All categories</option>${cats.map(c=>`<option ${c===F.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>`:''}<select id="so"><option value="">Sort by</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div><div id="list" class="grid"></div>`;
const up=()=>{F.q=$('#q').value;F.cat=$('#cat')?$('#cat').value:'';F.sort=$('#so').value;
let l=P.filter(p=>(!F.cat||p.cat===F.cat)&&p.name.toLowerCase().includes(F.q.toLowerCase()));
if(F.sort)l.sort((a,b)=>F.sort=='a'?a.price-b.price:b.price-a.price);
$('#list').innerHTML=l.map(card).join('')||'<p>No products found. Try another search.</p>'};
['q','cat','so'].forEach(i=>$('#'+i)&&($('#'+i).oninput=up));up()}

function prod(id){
const p=get(id);if(!p){app.innerHTML='<h2>Product not found</h2><p style="text-align:center"><a class="btn" href="#shop">Back to shop</a></p>';return}
sel='';qty=1;cur=p.id;const out=p.stock<=0;
app.innerHTML=`<div class="pg"><div><div class="big"><img id="mi" src="${esc(p.imgs[0])}" alt=""></div><div class="th">${p.imgs.map(i=>`<img src="${esc(i)}" alt="" onclick="$('#mi').src=this.src">`).join('')}</div></div>
<div>${p.tag?`<span class="tag">${esc(p.tag)}</span>`:''}<h1 class="pt">${esc(p.name)}</h1>
<div class="pr"><b>₹${p.price}</b>${p.old>p.price?`<s>₹${p.old}</s><em>${Math.round(100-p.price/p.old*100)}% off</em>`:''}</div>
<div id="lw">${lw(p)}</div><ul class="ft"><li>✓ Quality checked before shipping</li><li>✓ Clear photos and accurate details</li><li>✓ Delivery across India</li></ul>
${p.sizes.length?`<p><b>Choose an option:</b></p><div class="sz">${p.sizes.map(x=>`<button data-s="${esc(x.n)}" ${p.per&&x.s<=0?'disabled':''} onclick="pick(this)">${esc(x.n)}</button>`).join('')}</div>`:''}
<div class="qr"><div class="q"><button onclick="qt(-1)">−</button><span id="qv">1</span><button onclick="qt(1)">+</button></div><button class="btn" ${out?'disabled':''} data-id="${esc(p.id)}" onclick="addC(this.dataset.id)">${out?'Sold out':'Add to cart'}</button></div>
<button class="btn o" ${out?'disabled':''} data-id="${esc(p.id)}" onclick="addC(this.dataset.id,1)">Buy now</button></div></div>`}
function pick(b){document.querySelectorAll('.sz button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=b.dataset.s;const pp=get(cur);if(pp)$('#lw').innerHTML=lwn(szs(pp,sel))}
function qt(d){qty=Math.max(1,qty+d);$('#qv').textContent=qty}
function addC(id,buy){const p=get(id);if(p.sizes.length&&!sel)return toast('Please choose an option');
const mx=szs(p,sel),have=cart.filter(c=>c.id===id&&(p.per?c.size===sel:true)).reduce((a,c)=>a+c.qty,0);
if(have+qty>mx)return toast(mx<=0?'Sold out':'Only '+mx+' available');
const e=cart.find(c=>c.id===id&&c.size===sel);e?e.qty+=qty:cart.push({id,size:sel,qty});save();
buy?location.hash='cart':toast('Added to cart')}

const lines=()=>cart.filter(c=>get(c.id));
const total=()=>lines().reduce((a,c)=>a+get(c.id).price*c.qty,0);
function cartV(){
const L=lines();if(!L.length){app.innerHTML='<h2>Your cart</h2><p style="text-align:center">Your cart is empty.</p><p style="text-align:center"><a class="btn" href="#shop">Start shopping</a></p>';return}
app.innerHTML=`<h2>Your cart</h2>${L.map(c=>{const p=get(c.id),i=cart.indexOf(c);return `<div class="ci"><img src="${esc(p.imgs[0])}" alt=""><div><b>${esc(p.name)}</b><br>${c.size?'Option: '+esc(c.size)+'<br>':''}₹${p.price}<br><span class="q"><button onclick="cq(${i},-1)">−</button><span>${c.qty}</span><button onclick="cq(${i},1)">+</button></span><button class="rm" onclick="cq(${i},-99)">Remove</button></div></div>`}).join('')}
<div class="ship">Delivery across India. Pay by UPI or order on WhatsApp.</div>
<div class="tot"><span>Total</span><span>₹${total()}</span></div>
<button class="btn" style="width:100%" id="po" onclick="ask('upi')">Pay with UPI (GPay / PhonePe)</button>
<button class="btn o" id="pw" onclick="ask('wa')">Order on WhatsApp</button>`}
function cq(i,d){const c=cart[i],pp=get(c.id);
if(d>0&&pp){const mx=szs(pp,c.size),have=cart.filter(x=>x.id===c.id&&(pp.per?x.size===c.size:true)).reduce((a,x)=>a+x.qty,0);if(have+d>mx)return toast('Only '+mx+' available')}
c.qty+=d;if(c.qty<1)cart.splice(i,1);save();cartV()}
function ask(m){const u=me&&!me.admin?me:{};const d=document.createElement('div');d.className='dlg';d.id='dlg';
d.innerHTML=`<div class="box"><b>Delivery details</b><p class="sw" style="margin:6px 0 12px">Please enter your phone number and address to continue.</p><input id="dn" placeholder="Full name" value="${esc(u.name||'')}"><input id="dp" type="tel" placeholder="Phone number (10 digits)" value="${esc(u.phone||'')}"><textarea id="da" rows="3" placeholder="Full delivery address with pincode"></textarea><p id="de" style="color:var(--red);font-size:13px;margin:0 0 8px"></p><button class="btn" style="width:100%" onclick="go('${m}')">Continue</button><button class="btn o" onclick="$('#dlg').remove()">Cancel</button></div>`;
document.body.appendChild(d)}
function go(m){const n=$('#dn').value.trim(),ph=$('#dp').value.trim(),ad=$('#da').value.trim();
if(!n||ph.replace(/\D/g,'').length<10||ad.length<10){$('#de').textContent='Please enter your name, a 10-digit phone number and your full address.';return}
$('#dlg').remove();place(m,n,ph,ad)}
async function place(m,n,ph,ad){
const items=lines().map(c=>`${get(c.id).name}${c.size?' ('+c.size+')':''} x${c.qty}`).join(', '),t=total();
$('#po').disabled=true;$('#pw').disabled=true;
const r=await Promise.race([api('order',{name:n,phone:ph,address:ad,items,total:t,cartItems:lines().map(c=>({id:c.id,size:c.size,qty:c.qty})),method:m=='upi'?'UPI':'WhatsApp'}),new Promise(x=>setTimeout(()=>x({}),6000))]);
if(r.stock){alert(r.error);await reload();return cartV()}
const T=r.total||t;
if(m=='upi'){
if(!r.orderId){$('#po').disabled=false;$('#pw').disabled=false;return alert('Could not place the order. Please try again or order on WhatsApp.')}
cart=[];save();return payV(r.orderId,T)}
cart=[];save();
location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(`New order${r.orderId?' '+r.orderId:''}\nName: ${n}\nPhone: ${ph}\nAddress: ${ad}\nItems: ${items}\nTotal: ₹${T}`)}
function payV(id,t){
const link='upi://pay?pa='+encodeURIComponent(UPI)+'&pn='+encodeURIComponent(BRAND)+'&am='+Number(t).toFixed(2)+'&cu=INR&tn='+encodeURIComponent('Order '+id);
const q=link.slice(10),an=/android/i.test(navigator.userAgent);
const A=[['Google Pay','com.google.android.apps.nbu.paisa.user','gpay://upi/pay?'],['PhonePe','com.phonepe.app','phonepe://pay?'],['Paytm','net.one97.paytm','paytmmp://pay?'],['BHIM / other UPI apps','','upi://pay?']];
const hr=a=>an&&a[1]?'intent://pay?'+q+'#Intent;scheme=upi;package='+a[1]+';end':a[2]+q;
app.innerHTML=`<h2>Pay ₹${t}</h2><div class="paybox"><p style="text-align:center">Order number <b>${esc(id)}</b></p>
${A.map(a=>`<a class="btn" style="display:block;margin-bottom:10px" href="${esc(hr(a))}">Pay with ${a[0]}</a>`).join('')}
<p class="sw">UPI ID: <b>${esc(UPI)}</b> <button class="rm" onclick="navigator.clipboard.writeText(UPI);toast('UPI ID copied')">Copy</button></p>
<p class="sw">If your UPI app does not open, copy the UPI ID, pay ₹${t} in any UPI app and write ${esc(id)} in the note.</p>
<div class="fm"><input id="ut" placeholder="UPI transaction ID (optional)"></div>
<button class="btn o" style="margin-top:0" onclick="paid('${esc(id)}',${t})">I have paid</button>
<a class="btn o" style="display:block" href="https://wa.me/${WA}?text=${encodeURIComponent('Hi, I need help with order '+id)}">Need help? WhatsApp us</a></div>`}
async function paid(id,t){const u=$('#ut').value.trim();
await Promise.race([api('paid',{orderId:id,utr:u}),new Promise(x=>setTimeout(x,3000))]);
location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(`Payment done for order ${id}\nAmount: ₹${t} by UPI${u?'\nTransaction ID: '+u:''}\nI will send the payment screenshot here.`)}

const er=r=>r.error=='auth'?'Session expired. Please login to Admin again.':(r.error||'Failed');
async function reload(){const d=await fetch(API+'?t='+Date.now()).then(r=>r.json());
P=d.filter(p=>p.name).map(p=>{const z=ps(p.sizes),st=(p.stock===''||p.stock==null)?0:nm(p.stock);
return{id:String(p.id),name:p.name,price:nm(p.price),old:nm(p.oldPrice),tag:p.tag||'',cat:p.category||'',imgs:String(p.images||p.image||'').split(',').map(x=>x.trim()).filter(Boolean),sizes:z.l,per:z.per,stock:z.per?z.l.reduce((a,x)=>a+x.s,0):st}})}
function prodAdmin(){
if(!(me&&me.admin)){location.hash='admin';return}
app.innerHTML=`<h2>Manage products</h2><p style="text-align:center"><a class="btn o" style="width:auto;display:inline-block" href="#admin">Orders</a> <button class="btn" onclick="pform()">+ Add product</button></p><div id="pf"></div>${P.map(p=>`<div class="oc" style="overflow:hidden"><img src="${esc(p.imgs[0])}" alt="" style="width:60px;height:75px;object-fit:cover;float:left;margin-right:12px;border-radius:6px"><b>${esc(p.name)}</b><br>₹${p.price}${p.old>p.price?' <s>₹'+p.old+'</s>':''} · ${p.stock<=0?'SOLD OUT':'stock '+p.stock}${p.cat?' · '+esc(p.cat):''}<br><button class="rm" style="margin:0" onclick="pform('${esc(p.id)}')">Edit</button><button class="rm" onclick="pdel('${esc(p.id)}')">Delete</button></div>`).join('')||'<p style="text-align:center">No products yet.</p>'}`}
function pform(id){const p=id?get(id):{},v=x=>esc(x==null?'':x);
$('#pf').innerHTML=`<div class="fm auth oc"><b>${id?'Edit':'Add'} product</b><br><br>
<input id="f_name" placeholder="Product name" value="${v(p.name)}">
<input id="f_price" type="number" placeholder="Selling price (₹)" value="${v(p.price)}" oninput="fprev()">
<input id="f_old" type="number" placeholder="Old price (₹) - shown struck through" value="${p.old?p.old:''}" oninput="fprev()">
<input id="f_disc" type="number" placeholder="OR discount % (e.g. 30) - old price is calculated" oninput="fprev()">
<p id="f_prev" class="sw"></p>
<input id="f_cat" placeholder="Category (e.g. Earrings)" value="${v(p.cat)}">
<input id="f_tag" placeholder="Tag (e.g. NEW, Budget, Premium)" value="${v(p.tag)}">
<p class="sw" style="text-align:left;margin:4px 0 8px"><b>Sizes / options with stock</b> (skip if the product has none)</p>
<div id="f_sz">${(p.sizes||[]).map(x=>srow(x.n,x.s)).join('')}</div>
<button class="btn o" style="margin:0 0 10px" onclick="$('#f_sz').insertAdjacentHTML('beforeend',srow())">+ Add size</button>
<input id="f_stock" type="number" placeholder="Stock quantity (only if no sizes; blank = sold out)" value="${!p.per&&p.stock>0?p.stock:''}">
<textarea id="f_imgs" rows="3" placeholder="Image links (one per line)">${v((p.imgs||[]).join('\n'))}</textarea>
<input id="f_file" type="file" accept="image/*" multiple>
<p class="sw">Choose photos to upload. They are added to the links above.</p>
<button class="btn" style="width:100%" id="f_save" onclick="psave('${id||''}')">Save product</button></div>`;fprev();scrollTo(0,0)}
function srow(n,q){return `<div style="display:flex;gap:8px;margin-bottom:8px"><input class="sn" placeholder="Size (e.g. M)" value="${esc(n||'')}" style="margin:0"><input class="sq" type="number" min="0" placeholder="Stock" value="${q==null?'':q}" style="margin:0;max-width:90px"><button class="rm" onclick="this.parentNode.remove()">✕</button></div>`}
function fprev(){const p=nm($('#f_price').value),d=nm($('#f_disc').value);let o=nm($('#f_old').value);if(!o&&d&&d<100&&p)o=Math.round(p*100/(100-d));
$('#f_prev').textContent=p&&o>p?'Customers will see: ₹'+p+'  (was ₹'+o+')  '+Math.round(100-p/o*100)+'% off':'No discount shown. The old price must be higher than the selling price.'}
function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8).split(',')[1])};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
async function psave(id){const b=$('#f_save');b.disabled=true;b.textContent='Saving…';
try{const links=$('#f_imgs').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
for(const f of $('#f_file').files){b.textContent='Uploading photo…';const r=await api('uploadImage',{data:await shrink(f)});if(!r.ok)throw new Error(er(r));links.push(r.url)}
const pr=nm($('#f_price').value),dc=nm($('#f_disc').value);let ol=nm($('#f_old').value);if(!ol&&dc&&dc<100&&pr)ol=Math.round(pr*100/(100-dc));
const zr=[...document.querySelectorAll('#f_sz .sn')].map((e,k)=>({n:e.value.trim().replace(/[:,]/g,' '),s:nm(document.querySelectorAll('#f_sz .sq')[k].value)})).filter(x=>x.n).map(x=>({n:/^\d+$/.test(x.n)?'Size '+x.n:x.n,s:x.s}));
const szStr=zr.map(x=>x.n+':'+x.s).join(', '),stV=zr.length?zr.reduce((a,x)=>a+x.s,0):($('#f_stock').value===''?'':nm($('#f_stock').value));
const p={id,name:$('#f_name').value.trim(),price:pr,oldPrice:ol>pr?ol:'',category:$('#f_cat').value.trim(),tag:$('#f_tag').value.trim(),sizes:szStr,stock:stV,images:links.join(','),image:links[0]||''};
if(!p.name||!p.price||!links.length)throw new Error('Name, price and at least one photo are required');
b.textContent='Saving…';const r=await api('saveProduct',{product:p});if(!r.ok)throw new Error(er(r));
await reload();prodAdmin();toast('Product saved')}catch(e){alert(e.message);b.disabled=false;b.textContent='Save product'}}
async function pdel(id){if(!confirm('Delete this product?'))return;const r=await api('deleteProduct',{id});if(!r.ok)return alert(er(r));await reload();prodAdmin()}

function contact(){app.innerHTML=`<h2>Contact</h2><p style="text-align:center">Questions about an order or a design? Message us on WhatsApp.</p><p style="text-align:center"><a class="btn" href="https://wa.me/${WA}">Chat on WhatsApp</a></p>`}

function route(){
const h=decodeURIComponent(location.hash.slice(1));
$('#menu').classList.remove('on');$('#mb').textContent='☰';scrollTo(0,0);
if(h.startsWith('p-'))prod(h.slice(2));
else if(h.startsWith('shop'))shop(h.slice(5));
else if(h==='cart')cartV();
else if(h==='contact')contact();
else if(h==='categories')cats();else if(h==='login')login();else if(h==='account')account();else if(h==='admin')admin();else if(h==='admin-products')prodAdmin();
else home()}
window.onhashchange=()=>P.length&&route();

save();acl();
reload().then(route).catch(()=>{app.innerHTML='<h2>Could not load products</h2><p style="text-align:center">Check the API link in the SETTINGS section of index.html.</p>'});
</script></body></html>
